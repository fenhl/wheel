[package]
name = "wheel"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust boilerplate. Reinventing the wheel so you don't have to."

[lints.rust]
async_fn_in_trait = "allow"
missing_docs = "allow" #TODO
rust_2018_idioms = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(tokio_unstable)'] }
unsafe_code = "forbid"
unused = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
warnings = "deny"

[features]
default = ["futures", "tokio"]
github = ["github-app-auth", "jiff", "reqwest", "reqwest/blocking", "reqwest/query", "semver", "serde_json", "tokio", "tokio/time", "url"]
gui = ["dark-light", "gio", "iced"]
night = ["noisy_float"]
racetime = ["dep:racetime", "reqwest", "tungstenite030"]
reqwest = ["futures", "dep:reqwest", "tokio", "tokio-util"]
serde_json = ["serde", "dep:serde_json", "serde_path_to_error"]
tokio = ["dep:tokio"]
tungstenite021 = ["async-proto?/tokio-tungstenite021", "dep:tungstenite021"]
tungstenite024 = ["async-proto?/tokio-tungstenite024", "dep:tungstenite024"]
tungstenite030 = ["async-proto?/tokio-tungstenite030", "dep:tungstenite030"]

[dependencies]
async-proto = { version = "0.26", optional = true }
clap = "4" # used in proc macro
clap_complete = { version = "4", features = ["unstable-dynamic"] } # used in proc macro
console-subscriber = { version = "0.5", features = ["parking_lot"], optional = true } # used in proc macro; optional instead of cfg(tokio_unstable) to make Cargo properly ignore it when not used
#dark-light = { version = "2.0.0", optional = true } # https://github.com/rust-dark-light/dark-light/issues/73
dark-light = { git = "https://github.com/rust-dark-light/dark-light", optional = true }
futures = { version = "0.3", optional = true }
github-app-auth = { git = "https://github.com/fenhl/github-app-auth", optional = true }
iced = { version = "0.14", optional = true }
itertools = "0.15"
jiff = { version = "1", optional = true }
noisy_float = { version = "0.2", optional = true }
racetime = { version = "0.36", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["stream"], optional = true }
rocket = { git = "https://github.com/fenhl/Rocket", branch = "forms", optional = true } # used in proc macro
semver = { version = "1", optional = true }
serde = { version = "1", optional = true }
serde_json = { package = "serde_json_path_to_error", version = "0.1", optional = true }
serde_path_to_error = { version = "0.1", optional = true }
thiserror = "2"
tokio-util = { version = "0.7", features = ["io"], optional = true }
tungstenite021 = { package = "tungstenite", version = "0.21", optional = true }
tungstenite024 = { package = "tungstenite", version = "0.24", optional = true }
tungstenite030 = { package = "tungstenite", version = "0.30", optional = true }
url = { version = "2", features = ["serde"], optional = true }
wheel-derive = { path = "../wheel-derive" }

[target.'cfg(tokio_unstable)'.dependencies]
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "parking_lot", "process", "rt-multi-thread", "sync", "tracing"], optional = true }

[target.'cfg(not(tokio_unstable))'.dependencies]
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "parking_lot", "process", "rt-multi-thread", "sync"], optional = true }

[target.'cfg(all(target_os = "linux", not(doc)))'.dependencies]
gio = { version = "0.22", optional = true }
