[package]
name = "wheel-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "wheel"
path = "src/main.rs"

[build-dependencies]
cargo_metadata = "0.23"
thiserror = "2"

[dependencies]
clap = { version = "4", features = ["derive"] }
gix = "0.90"
mimalloc = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["process"] }
toml = "1"
wheel = { path = "../wheel" }
